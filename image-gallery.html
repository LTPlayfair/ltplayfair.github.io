<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LT Playfair | Image Library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f7f7;font:15px Arial,Helvetica,sans-serif}header{padding:28px max(18px,4vw);border-bottom:1px solid #444}h1{margin:0;font-size:clamp(26px,5vw,48px);letter-spacing:-1px}header p{color:#bdbdbd;margin:8px 0 0}.yellow{color:#ffe32b}main{max-width:1500px;margin:auto;padding:24px 18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,button{font:inherit;border:1px solid #555;border-radius:4px;padding:11px;background:#222;color:white}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:#ffe32b}#status{color:#aaa;margin:14px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.item{min-width:0;background:#1c1c1c;border:1px solid #333;border-radius:5px;overflow:hidden}.item img{width:100%;height:190px;object-fit:contain;background:#fff;display:block}.info{padding:10px}.name{font-size:12px;overflow-wrap:anywhere;min-height:40px}.folder{font-size:11px;color:#aaa;margin:5px 0 10px}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:7px;flex:1}.actions a{color:#ffe32b;font-size:12px;align-self:center;text-decoration:none}footer{padding:30px 18px;color:#999;text-align:center;font-size:12px}
</style></head><body>
<header><h1>LT PLAYFAIR <span class="yellow">/ IMAGE LIBRARY</span></h1><p>BRUTALIST FIGURATION / VISUAL FILE FINDER</p></header>
<main><div class="tools"><input id="search" placeholder="Search filenames…" aria-label="Search filenames"><select id="folder" aria-label="Image folder"><option value="all">All images</option><option value="root">Main images folder</option><option value="gallery">Gallery Edition</option><option value="products">Products</option></select><button id="refresh">Refresh</button></div>
<div id="status" role="status">Loading images from GitHub…</div><div class="grid" id="grid"></div></main><footer>LT PLAYFAIR · MY LINES HAVE WEIGHT. · Public image library</footer>
<script>
const owner='LTPlayfair',repo='ltplayfair.github.io',branch='main';
const base='https://ltplayfair.github.io/';
const search=document.getElementById('search'),folder=document.getElementById('folder'),grid=document.getElementById('grid'),status=document.getElementById('status');
let images=[];
function category(p){let s=p.toLowerCase().split('/');if(s[1]==='products')return 'products';if(s[1]&&s[1].replace(/[-_ ]/g,'').includes('galleryedition'))return 'gallery';return s.length===2?'root':'other'}
function url(p){return base+p.split('/').map(encodeURIComponent).join('/')}
function render(){let q=search.value.toLowerCase().trim(),f=folder.value;let matches=images.filter(p=>(f==='all'||category(p)===f)&&(p.toLowerCase().includes(q)));status.textContent=matches.length+' images shown / '+images.length+' total';grid.replaceChildren();let fragment=document.createDocumentFragment();for(let p of matches){let card=document.createElement('article');card.className='item';let img=document.createElement('img');img.loading='lazy';img.alt=p.split('/').pop();img.src=url(p);let info=document.createElement('div');info.className='info';let name=document.createElement('div');name.className='name';name.textContent=p.split('/').pop();let sub=document.createElement('div');sub.className='folder';sub.textContent=p.substring(0,p.lastIndexOf('/'));let actions=document.createElement('div');actions.className='actions';let copy=document.createElement('button');copy.textContent='Copy URL';copy.onclick=async()=>{try{await navigator.clipboard.writeText(url(p));copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy URL',1400)}catch(e){prompt('Copy image URL:',url(p))}};let link=document.createElement('a');link.href=url(p);link.target='_blank';link.rel='noopener';link.textContent='Open';actions.append(copy,link);info.append(name,sub,actions);card.append(img,info);fragment.append(card)}grid.append(fragment)}
async function load(){status.textContent='Loading images from GitHub…';try{let response=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/git/trees/'+branch+'?recursive=1',{cache:'no-store'});if(!response.ok)throw Error('GitHub API error '+response.status);let data=await response.json();if(data.truncated)throw Error('GitHub returned an incomplete file list.');images=data.tree.filter(x=>x.type==='blob'&&/^images\//i.test(x.path)&&/\.(jpg|jpeg|png|webp|gif|avif)$/i.test(x.path)).map(x=>x.path).sort((a,b)=>a.localeCompare(b));render()}catch(e){status.textContent='Could not load image list: '+e.message+'. Try Refresh later.'}}
search.addEventListener('input',render);folder.addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
